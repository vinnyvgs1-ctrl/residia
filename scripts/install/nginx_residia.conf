# ========================================================================
# RESIDIA CRM • ROBLEDAL CONNECTING
# Configuración Virtual Host Nginx de Alto Rendimiento en Producción
# Ubicación en Servidor: /etc/nginx/sites-available/residia
# ========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name residia.robledal.com; # Modificar por el dominio real o IP

    # Redirección automática a HTTPS (Recomendado en Producción)
    # return 301 https://$host$request_uri;

    root /var/www/residia/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # Cabeceras de Seguridad Perimetral
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Soporte para Notificaciones Server-Sent Events (SSE) sin Buffering
    location /api/notificaciones/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Ajustar según versión de PHP instalada
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
